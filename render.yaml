services:
  - type: web
    name: flash-lab-demo-0353caa7
    runtime: node
    plan: 0.5c-512mb
    branch: coderabbit/run-selected-skill/0353caa7
    rootDir: flash-app
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: FLASH_DATA_DIR
        value: /var/data
      - key: FLASH_SECURE_COOKIE
        value: "1"
      - key: FLASH_ADMIN_EMAIL
        sync: false
      - key: FLASH_ADMIN_PASSWORD
        sync: false
    disk:
      name: flash-lab-data
      mountPath: /var/data
      sizeGB: 1
